group 'com.example.tradplus_sdk'
version '1.0'

buildscript {
    repositories {
        flatDir {
            dirs 'libs'
        }
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
    }
}

rootProject.allprojects {
    repositories {
        flatDir {
            dirs 'libs'
        }
        google()
        mavenCentral()

    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 36
    namespace 'com.example.tradplus_sdk'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk 23
    }
}

def TRADPLUS_VERSION = "15.4.0.1"

dependencies {
    //TradPlus
    compileOnly "com.tradplusad:tradplus:${TRADPLUS_VERSION}"
    compileOnly 'com.quality-ad:uid2-adapter:1.0.0'
    compileOnly 'com.tradplusad:tradplus-tool:1.1.7'

    testImplementation 'junit:junit:4.13.2'

}
